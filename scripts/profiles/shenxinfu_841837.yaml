# shenxinfu_841837 profile: voxel guard + manual LiDAR + actual odom/TF.
# Default run from repo root:
#   python3 scripts/arena_scene_profile.py --profile scripts/profiles/shenxinfu_841837.yaml bridge rtx_scan
#   python3 scripts/arena_scene_profile.py --profile scripts/profiles/shenxinfu_841837.yaml spawn
#   python3 scripts/arena_scene_profile.py --profile scripts/profiles/shenxinfu_841837.yaml teleop

default_mode: physx_wheels
mode_files:
  physx_wheels: modes/physx_wheels.yaml
  physx_diff_contact: modes/physx_diff_contact.yaml

bridge:
  isaac_path: $HOME/resources/isaac-sim-4.5.0
  log_level: info
  idle_fps: 5
  active_fps: 30
  mem_log_sec: 30
  enable_people_stack: false
  enable_character_services: false
  people_extension_mode: minimal
  enable_material_stack: false
  enable_navmesh: false
scene:
  mode: usd
  name: shenxinfu_841837
  root_path: /World/shenxinfu_841837
  usd_path: /home/stardust/resources/arena_ws/arena_assets/scenes/real/shenxinfu/841837/start.usda
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
robot:
  name: xms_mecanum
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  odom_frame: odom
  base_frame: base_link
  yaw: 0.0
  cmd_vel_applied_topic: /cmd_vel_applied
  use_sim_time: true
robot_geometry:
  auto_footprint: false
  z_min: -0.1
  z_max: 0.45
  include_keywords: []
  exclude_keywords:
  - arm
  - gripper
  - finger
  - camera
  - lidar
  - laser
  - sensor
  - marker
  - debug
lidar:
  # RTX is the main navigation scan source. synthetic_2d remains an explicit
  # fallback for environments where RTX cannot be used.
  backend: rtx
  mount_source: calibration_urdf
  calibration_dir: /home/stardust/resources/calibration/src/stardust_calibration/urdf/v25730
  front_frame: base_scan_01
  rear_frame: base_scan_02
  front_topic: /front_scan
  rear_topic: /rear_scan
  # Isaac Sim 4.5 can republish cached solid-state RTX frames on render ticks.
  # Keep only one ROS message per unique sensor timestamp.
  deduplicate: true
  # Range offset is applied only to the RTX backend and can help suppress
  # near-field self hits from the robot body.
  range_offset_m: 0.03
  publish_points: false
  visualize: false
  synthetic_2d:
    # Synthetic fallback source: live OccupancyGrid or an explicit map.yaml.
    # Keep map_path only as a compatibility fallback until the shenxinfu map YAML
    # or /map publisher is fully wired.
    map_topic: /map
    auto_use_map_topic_frame: true
    map_yaml_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.map.yaml
    map_occupied_threshold: 50
    map_unknown_is_occupied: false
    map_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.json.gz
    map_frame: odom
    samples: 721
    fov_deg: 270.0
    range_min: 0.05
    range_max: 12.0
    update_rate: 15.0
    z_min: 0.05
    z_max: 1.20
    tf_timeout_sec: 0.05
    dynamic_enabled: true
    people_frame: ""
    people_topic: /task_generator_node/people
    arena_people_topic: /task_generator_node/arena_peds
    pedestrian_radius: 0.35
    pedestrian_timeout_sec: 1.0
    # Diagnostic knobs.  Leave as zero/false first; adjust only if the scan is
    # visibly rotated or mirrored in RViz.
    front_angle_offset_deg: 0.0
    rear_angle_offset_deg: 0.0
    front_reverse: false
    rear_reverse: false
    log_sec: 2.0
odom_tf:
  publish_actual: true
  publish_sensor_static_tf: true
proxy:
  enable_scene_collision_repair: true
  repair_mode: safe
  source: auto
  config_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.proxies.yaml
  auto_write_config: true
  visible: true
  enable_wall_proxy: true
  enable_door_proxy: true
  door_default_enabled: false
  wall_default_enabled: true
collision2d:
  config_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.collision2d.yaml
  debug_svg: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.collision2d.svg
  resolution: 0.03
  refresh_sec: 1.0
voxel:
  map_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.json.gz
  debug_svg: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.svg
  debug_pcd: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.pcd
  resolution: 0.05
  sample_step: 0.05
  z_min: 0.05
  z_max: 1.2
  refresh_sec: 1.0
  build_timeout: 900.0
  max_faces_per_mesh: 100000
  max_samples_per_mesh: 250000
  max_stored_voxels: 300000
  max_debug_stage_points: 30000
  create_stage_debug_points: true
  stage_debug_path: ''
  skip_keywords:
  - _collision_proxy
  - /World/robots
  - groundPlane
  - ground_plane
  - /Light
  - dlight
  - downlight
  - camera
  - lidar
  - sensor
  - Ceiling
  - Floor_Floor
  - /Floor/
  - Tuyere
  include_keywords: []
guard:
  backend: voxel
  length: 0.7
  width: 0.42
  margin: 0.02
  z_max: 1.0
  log_sec: 5.0
  block_log_sec: 2.0
  overlap_policy: escape
  escape_epsilon: 0.0001
  overlap_deadband: 0.005
  escape_tolerance: 0.002
  last_free_max_age_sec: 8.0
physx_root_velocity:
  height_kp: 8.0
  height_max_vel: 0.35
  upright_kp: 10.0
  upright_max_ang_vel: 1.5
  fallback_kinematic: true
arm_hold:
  # Stage-1 navigation pose: keep the arm low and tucked close to the base.
  # joint order = joint1..joint6
  positions:
  - -0.04719
  - -0.2495
  - -0.477
  - -0.0703
  - -2.51
  - 1.74
  # Navigation mode should also stop the finger mimic pair from hunting.
  gripper_positions:
  - 0.0
  - 0.0
  hard_sync: true
  disable_gravity: true
  drive_stiffness: 100000.0
  drive_damping: 10000.0
  drive_max_force: 100000.0
teleop:
  linear: 0.2
  lateral: 0.2
  angular: 0.5
gamepad:
  # URDF wheel centers are at y=+/-0.1725 m, giving a 0.345 m track width.
  device_id: 0
  joy_topic: /joy
  cmd_vel_topic: /cmd_vel_gamepad_diff
  linear_axis: 1
  angular_axis: 0
  enable_button: 0
  linear_scale: 0.2
  angular_scale: 0.5
  deadzone: 0.1
  joy_timeout_sec: 0.5
  priority_timeout_sec: 0.3
  track_width_m: 0.345
pedestrians:
  # Radius at which the bridge switches to the next AnimGraph path point.
  # Keep this aligned with toilet_benchmark.director.actor_stop_radius_m while tuning.
  stop_radius_m: 0.5
  # Tight portal/recovery paths must reach bends before turning in narrow doorways.
  constrained_waypoint_radius_m: 0.08
  robot_interaction_policy: avoid
  physics_proxy_enabled: true
  hard_guard_enabled: false
  # Observe animated skeleton clearance without changing pedestrian motion.
  visual_envelope_enabled: true
  visual_envelope_hz: 2.0
  visual_envelope_radius_m: 0.08
  visual_envelope_segment_spacing_m: 0.05
  # People Walk is an animation blend, not a metric speed. This calibration
  # compensates its nonlinear root-motion response to HuNav velocities.
  external_motion_animation_full_speed_mps: 0.3082
  external_motion_animation_speed_exponent: 1.7670
  # The stock People graph is forward-walk only. Slow through sharper turns
  # while keeping AnimGraph PathPoints authoritative over the locomotion root.
  external_turn_slow_angle_deg: 20.0
  external_turn_full_slow_angle_deg: 55.0
  external_turn_min_speed_scale: 0.25
  external_turn_yaw_rate_radps: 2.8
  hard_guard_margin_m: 0.04
  hard_guard_control_latency_sec: 0.10
  hard_guard_sample_dt_sec: 0.04
  hard_guard_pedestrian_horizon_sec: 0.35
  auto_sample: true
  voxel_map_path: /home/stardust/resources/arena_ws/arena_assets/collision_configs/shenxinfu_841837.voxel.json.gz
  count: 2
  seed: 12345
  clearance: 0.34
  min_path_length: 1.4
  max_path_length: 4.8
  boundary_margin: 0.25
  velocity_min: 0.35
  velocity_max: 0.48
  stage_prefix: social_ped_
  dump_generated_yaml: /tmp/shenxinfu_841837.social_nav.generated.yaml
  agents_yaml: /home/stardust/resources/arena_ws/src/arena/arena-isaac/scripts/pedestrians/shenxinfu_841837.social_nav.yaml
phases:
  edit:
    proxy_source: auto
    proxy_visible: true
    auto_write_config: true
    enable_guard: false
    overlap_policy: escape
    guard_backend: proxy
  verify:
    proxy_source: config
    proxy_visible: true
    auto_write_config: false
    enable_guard: false
    overlap_policy: escape
    guard_backend: proxy
  guard:
    proxy_source: config
    proxy_visible: false
    auto_write_config: false
    enable_guard: true
    overlap_policy: escape
    guard_backend: proxy
  strict:
    proxy_source: config
    proxy_visible: true
    auto_write_config: false
    enable_guard: true
    overlap_policy: block
    guard_backend: proxy
  guard2d:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: false
    enable_guard: true
    overlap_policy: escape
    guard_backend: 2d
  strict2d:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: false
    enable_guard: true
    overlap_policy: block
    guard_backend: 2d
  debug2d:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: false
    enable_guard: true
    overlap_policy: escape
    guard_backend: 2d
  voxel_build:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: false
    enable_guard: false
    overlap_policy: escape
    guard_backend: voxel
  voxel_guard:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    enable_guard: true
    overlap_policy: escape
    guard_backend: voxel
  voxel_strict:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    enable_guard: true
    overlap_policy: block
    guard_backend: voxel
  voxel_debug:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    enable_guard: true
    overlap_policy: escape
    guard_backend: voxel
  social_nav:
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    enable_guard: true
    overlap_policy: escape
    guard_backend: voxel
    enable_people_stack: true
    enable_character_services: true
    people_extension_mode: replicator_agent_core
    enable_navmesh: false
    lidar_backend: synthetic_2d
  rtx_scan:
    mode: physx_wheels
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    overlap_policy: escape
    enable_people_stack: true
    enable_character_services: true
    people_extension_mode: replicator_agent_core
    enable_navmesh: false
    lidar_backend: rtx
    update_rate: 15.0
  physx_diff_contact:
    mode: physx_diff_contact
    proxy_source: 'off'
    proxy_visible: false
    auto_write_config: false
    enable_scene_collision_repair: true
    overlap_policy: escape
    enable_people_stack: true
    enable_character_services: true
    people_extension_mode: replicator_agent_core
    enable_navmesh: false
    lidar_backend: rtx
    update_rate: 15.0
